<!doctype html>
<html lang="pt-BR" data-mode="claro">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cascob — Recuperação de Crédito</title>
  <meta name="description" content="Há mais de 10 anos a Cascob ajuda famílias brasileiras a limpar o nome, renegociar dívidas e recuperar o crédito. Análise gratuita pelo WhatsApp."/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="styles.css"/>

  <style>
    /* Print-only adjustments */
    @page { size: A4 portrait; margin: 14mm 12mm; }

    @media print {
      html, body {
        background: #fff !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* hide interactive chrome */
      .nav, .float-wa, .tweaks-panel, [data-tweaks-panel], #tweaks-toggle { display: none !important; }

      /* let sections flow naturally on pages */
      .section, .hero, .footer {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .hero { padding-top: 0 !important; }
      .section { padding-top: 32px !important; padding-bottom: 32px !important; }

      /* control major page breaks for readability */
      #servicos, #como-funciona, #resultados, #depoimentos, #faq, #contato {
        page-break-before: always;
        break-before: page;
      }

      /* trim margins on footer */
      .footer { padding: 24px 0 !important; }

      /* avoid orphaned headings */
      h1, h2, h3 { page-break-after: avoid; break-after: avoid; }

      /* Disable the floating hero animation for print */
      .hero-logo img { animation: none !important; }

      /* allow grids to wrap cleanly */
      .servicos__grid, .metrics, .quotes, .steps {
        page-break-inside: auto !important;
        break-inside: auto !important;
      }
      .serv-card, .metric, .quote, .step, .faq__item {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }

    /* Also apply on screen so the print preview matches */
    body { background: #fff; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="font-family: system-ui">
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel">
    // wait for fonts + Babel-transpiled scripts + a settle delay, then print
    (async () => {
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
      // wait for React app to mount
      let tries = 0;
      while (tries < 60 && !document.querySelector('.hero')) {
        await new Promise(r => setTimeout(r, 100));
        tries++;
      }
      await new Promise(r => setTimeout(r, 600));
      window.print();
    })();
  </script>
</body>
</html>
